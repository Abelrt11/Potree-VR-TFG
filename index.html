<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potree VR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      font-family: sans-serif;
    }
    h1 {
      color: #e6edf3;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    .start-btn {
      display: inline-block;
      color: #e6edf3;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px 64px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }
    .start-btn:hover {
      border-color: #58a6ff;
      background: #2d333b;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <h1>Potree VR</h1>
  <a class="start-btn" href="examples/1_ejemplo_profe.html">Empezar</a>
</body>
</html>
