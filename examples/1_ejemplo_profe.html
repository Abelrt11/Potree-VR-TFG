<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">

<script type="module">
  import * as THREE from "../libs/three.js/build/three.module.js";
  import * as VR_Cosas from "../libs/three.js/libs/motion-controllers.module.js";
  // ===== Log overlay (DOM) - muestra logs en pantalla para depuración en VR =====
  function createLogOverlay(){
    const overlay = document.createElement('div');
    overlay.id = 'log_overlay';
    Object.assign(overlay.style, {
      position: 'fixed',
      right: '12px',
      bottom: '12px',
      width: '360px',
      maxHeight: '40vh',
      overflowY: 'auto',
      background: 'rgba(0,0,0,0.75)',
      color: '#88ff88',
      fontFamily: 'monospace',
      fontSize: '12px',
      padding: '8px',
      zIndex: '2147483647',
      borderRadius: '6px',
      boxShadow: '0 2px 8px rgba(0,0,0,0.5)'
    });
    // Allow clicks when testing (so you can copy text etc.)
    overlay.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    document.body.appendChild(overlay);
    return overlay;
  }

  const logOverlay = createLogOverlay();

  function safeStringify(v){
    try { if (typeof v === 'object') return JSON.stringify(v); } catch(e) { return String(v); }
    return String(v);
  }

  function appendLog(msg, level='log'){
    const line = document.createElement('div');
    const ts = new Date().toISOString().substr(11,8);
    line.textContent = `[${ts}] ${msg}`;
    if(level === 'error') line.style.color = '#ff8080';
    else if(level === 'warn') line.style.color = '#ffd480';
    line.style.whiteSpace = 'pre-wrap';
    logOverlay.appendChild(line);
    // limit history
    while(logOverlay.childNodes.length > 300) logOverlay.removeChild(logOverlay.firstChild);
    logOverlay.scrollTop = logOverlay.scrollHeight;
  }

  // Solo muestra console.log en el overlay; warn/error van solo a la consola del navegador
  (function(){
    const _log = console.log.bind(console);
    console.log = function(...args){ _log(...args); appendLog(args.map(safeStringify).join(' ')); };
    window.clearLogOverlay = function(){ logOverlay.innerHTML = ''; };
  })();

  let viewmode = 2;
  let cloudIndex = 1;

  function getCloudUrl(idx) {
    switch(idx) {
      case 2:  return 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/ejemplo2/metadata.json';
      case 3:  return 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/ejemplo3/metadata.json';
      case 5:  return 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/ejemplo5/metadata.json';
      default: return 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/ejemplo1/metadata.json';
    }
  }

  window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
  viewer.renderer.xr.enabled = true;
  viewer.renderer.xr.setReferenceSpaceType('local-floor');
  viewer.setEDLEnabled(true);
  viewer.setFOV(60);  // FOV más amplio para sensación más inmersiva
  viewer.setPointBudget(10_000_000);

  viewer.setDescription(`Walker Mode: Experience the point cloud from ground level.
            Use arrow keys or mouse to navigate. <br>
            Point cloud courtesy of <a href="http://www.helimap.com/">Helimap System SA</a>.`);

  viewer.loadGUI(() => {
    viewer.setLanguage('en');
    $("#menu_appearance").next().show();
    viewer.toggleSidebar();
  });
  loadCloudMode(viewmode);

  document.addEventListener("keydown", (e) => {
    if (e.key === "2") {
      changeViewmode();
    }
    if (e.key === "1") {
      if (viewer.vrControls) viewer.vrControls.toggleMenu();
      else console.log("[VRMenu] vrControls no disponible aún");
    }
    if (e.key === "3") { // prueba en escritorio: alternar visión de anomalías
      const next = !window.anomaliesWanted;
      document.dispatchEvent(new CustomEvent('vr-anomalies-toggle', { detail: { active: next } }));
    }
  });
  

  
  
  
  
  // Recibe la selección de modo desde el menú VR de VRControls
  document.addEventListener('vr-mode-select', (e) => {
    if(e.detail.mode === 3) return; // modo puntos: no recargar la nube
    viewmode = e.detail.mode;
    loadCloudMode(viewmode);
  });

  // Recibe la selección de nube desde el submenú VR
  document.addEventListener('vr-cloud-select', (e) => {
    cloudIndex = e.detail.cloud;
    window.anomaliesWanted = false; // al cambiar de nube, partir con anomalías ocultas
    loadCloudMode(viewmode);
  });

  // Activa/desactiva la visión de anomalías desde el menú VR / squeeze. Cada anomalía es un
  // volumen de recorte cilíndrico: 'visible' muestra el cilindro rojo; 'clip' activa el
  // resaltado (rojo) de los puntos de su interior vía el shader (clipTask=HIGHLIGHT).
  document.addEventListener('vr-anomalies-toggle', (e) => {
    window.anomaliesWanted = e.detail.active;
    const vols = window.anomalyVolumes || [];
    for (const v of vols) { v.visible = e.detail.active; v.clip = e.detail.active; }
    // Garantizar el modo de resaltado (por si se tocó el "Clip Task" en el menú de zonas).
    if (e.detail.active) {
      viewer.setClipTask(Potree.ClipTask.HIGHLIGHT);
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
    }
    console.log('[Anomalías] toggle=' + e.detail.active + ' volúmenes=' + vols.length);
  });

  // Cartel de sendero (scene.scene): en escritorio con EDL hay que redibujarlo en el overlay
  // (tras clearDepth) o el quad EDL lo taparía. Los cilindros de anomalías ya NO van aquí:
  // son volúmenes (viewer.volumeTool.scene), que se dibujan después de los puntos por sí solos.
  viewer.addEventListener('render.pass.perspective_overlay', () => {
    const s = window.trailSignGroup;
    if (s && s.visible) {
      viewer.renderer.render(s, viewer.scene.getActiveCamera());
    }
  });

  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
  /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

  function changeViewmode() {
    viewmode = viewmode === 1 ? 2 : 1;
    console.log("viewmode", viewmode);
    loadCloudMode(viewmode);
  }
  function clearPointClouds() {
    for (const pc of viewer.scene.pointclouds.slice()) {
      viewer.scene.scenePointCloud.remove(pc);
    }
    viewer.scene.pointclouds.length = 0;

    // Quitar los volúmenes de anomalía al cambiar de nube
    removeAnomalyVolumes();

    // Quitar el cartel de sendero al cambiar de nube (solo existe en Paseo Garañón)
    if (window.trailSignGroup && window.trailSignGroup.parent) {
      window.trailSignGroup.parent.remove(window.trailSignGroup);
    }
    window.trailSignGroup = null;
  }

  function syncVRToScene() {
    if (viewer.renderer.xr.isPresenting && viewer.vrControls) {
      viewer.vrControls.onStart();
    }
  }

  function loadCloudMode(viewmode) {
    if (cloudIndex === 'corredor') { loadCorridorCloud(viewmode); return; }
    if (cloudIndex === 'gran_corredor') { loadGranCorridorCloud(viewmode); return; }
    if (cloudIndex === 'gran_corredor_2') { loadGranCorridor2Cloud(viewmode); return; }
    if (cloudIndex === 'anomalias') { loadAnomaliesCloud(viewmode); return; }
    clearPointClouds();
    switch (viewmode) {

      case 1: //Aerial mode
        Potree.loadPointCloud(getCloudUrl(cloudIndex)).then(e => {
          let pointcloud = e.pointcloud;
          let material = e.pointcloud.material;
          material.size = 1;
          material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          viewer.scene.addPointCloud(pointcloud);

          // Forzar que matrixWorld esté actualizado antes de transformar el bbox
          pointcloud.updateMatrixWorld(true);

          // Transformar el boundingBox local de la nube a coordenadas mundo (UTM)
          let bbox = pointcloud.boundingBox.clone();
          bbox.applyMatrix4(pointcloud.matrixWorld);

          let center = bbox.getCenter(new THREE.Vector3());
          let size = bbox.getSize(new THREE.Vector3());
          let distance = Math.max(size.x, size.y, size.z) * 1.2;

          console.log(`[God] center=(${center.x.toFixed(0)},${center.y.toFixed(0)},${center.z.toFixed(0)}) size=(${size.x.toFixed(0)},${size.y.toFixed(0)},${size.z.toFixed(0)}) dist=${distance.toFixed(0)}`);

          // Cámara diagonal arriba/atrás (Z = arriba en este sistema)
          let camPos = new THREE.Vector3(
            center.x + distance,
            center.y - distance,
            center.z + distance
          );
          viewer.scene.view.position.copy(camPos);
          viewer.scene.view.lookAt(center);

          viewer.scene.getActiveCamera().near = Math.max(0.1, distance / 1000);
          viewer.scene.getActiveCamera().far = distance * 20;
          viewer.scene.getActiveCamera().updateProjectionMatrix();

          viewer.setMoveSpeed(distance / 5);
          syncVRToScene();
        });

        break;
      case 2: //walker mode
        viewer.setControls(new Potree.FirstPersonControls(viewer));
        Potree.loadPointCloud(getCloudUrl(cloudIndex)).then(e => {
          let pointcloud = e.pointcloud;
          let material = e.pointcloud.material;
          material.size = 0.5;
          material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          viewer.scene.addPointCloud(pointcloud);
          pointcloud.scale.set(10, 10, 10);
          pointcloud.updateMatrix();

          let bbox = pointcloud.boundingBox;
          let size = bbox.getSize(new THREE.Vector3());

          viewer.scene.getActiveCamera().near = 0.1;
          viewer.scene.getActiveCamera().far = Math.max(size.x, size.y, size.z) * 10;
          viewer.scene.getActiveCamera().updateProjectionMatrix();

          let walkerCoords;
          switch(cloudIndex) {
            case 2:  walkerCoords = [426768.400, 4478215.481, 835.360  + 20.7]; break;
            case 3:  walkerCoords = [424328.211, 4476365.500, 785.870  + 20.7]; break;
            case 5:  walkerCoords = [425538.371, 4474447.171, 854.129  + 20.7]; break;
            default: walkerCoords = [426808.02,  4478030.49,  1034.87  + 20.7]; break;
          }
          let camPos = new THREE.Vector3(...walkerCoords);
          viewer.scene.view.position.copy(camPos);

          let lookAtPos = camPos.clone();
          lookAtPos.y += 1;
          viewer.scene.view.lookAt(lookAtPos);
          viewer.setMoveSpeed(10);
          syncVRToScene();
        });

        break;
    }
  }

  // Carga combinada del corredor: nubes 1, 2 y 3 a la vez.
  // Comparten sistema de coordenadas UTM, así que en modo Dios encajan solas.
  // En modo Paseo se escalan x10 respecto a un pivote común (la nube 1) para
  // conservar el teselado del corredor (ver PointCloudOctree.js:115).
  function loadCorridorCloud(viewmode) {
    clearPointClouds();
    const base = 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/';
    const urls = [
      base + 'ejemplo1/metadata.json',
      base + 'ejemplo2/metadata.json',
      base + 'ejemplo3/metadata.json',
    ];

    if (viewmode === 2) viewer.setControls(new Potree.FirstPersonControls(viewer));

    Promise.all(urls.map(u => Potree.loadPointCloud(u))).then(results => {
      const pcs = results.map(r => r.pointcloud);
      for (const pc of pcs) {
        pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
        pc.material.size = (viewmode === 1) ? 1 : 0.5;
        viewer.scene.addPointCloud(pc);
      }

      if (viewmode === 1) { // ---- Modo Dios (aéreo): posiciones naturales + encuadre del bbox unión
        let union = null;
        for (const pc of pcs) {
          pc.updateMatrixWorld(true);
          const b = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
          union = union ? union.union(b) : b;
        }
        const center = union.getCenter(new THREE.Vector3());
        const size = union.getSize(new THREE.Vector3());
        const distance = Math.max(size.x, size.y, size.z) * 1.2;

        console.log(`[Corredor/God] center=(${center.x.toFixed(0)},${center.y.toFixed(0)},${center.z.toFixed(0)}) size=(${size.x.toFixed(0)},${size.y.toFixed(0)},${size.z.toFixed(0)}) dist=${distance.toFixed(0)}`);

        const camPos = new THREE.Vector3(
          center.x + distance,
          center.y - distance,
          center.z + distance
        );
        viewer.scene.view.position.copy(camPos);
        viewer.scene.view.lookAt(center);

        viewer.scene.getActiveCamera().near = Math.max(0.1, distance / 1000);
        viewer.scene.getActiveCamera().far = distance * 20;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        viewer.setMoveSpeed(distance / 5);
      } else { // ---- Modo Paseo (walker): escala x10 respecto a pivote común (nube 1)
        const pivot = pcs[0].position.clone(); // esquina UTM de la nube 1
        for (const pc of pcs) {
          const off = pc.position.clone();
          pc.scale.set(10, 10, 10);
          pc.position.set(
            10 * off.x - 9 * pivot.x,
            10 * off.y - 9 * pivot.y,
            10 * off.z - 9 * pivot.z
          );
          pc.updateMatrix();
        }

        let union = null;
        for (const pc of pcs) {
          pc.updateMatrixWorld(true);
          const b = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
          union = union ? union.union(b) : b;
        }
        const size = union.getSize(new THREE.Vector3());

        viewer.scene.getActiveCamera().near = 0.1;
        viewer.scene.getActiveCamera().far = Math.max(size.x, size.y, size.z) * 10;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        // Entrada = misma posición que la nube 1 en solitario (es el pivote)
        const camPos = new THREE.Vector3(426808.02, 4478030.49, 1034.87 + 20.7);
        viewer.scene.view.position.copy(camPos);

        const lookAtPos = camPos.clone();
        lookAtPos.y += 1;
        viewer.scene.view.lookAt(lookAtPos);
        viewer.setMoveSpeed(10);
      }
      syncVRToScene();
    });
  }

  // Carga combinada del "Gran Corredor": 10 partes (parte1..parte10) desde R2.
  // Misma estrategia que loadCorridorCloud (3 partes): en Dios encuadre del bbox unión;
  // en Paseo escala x10 con pivote en la parte 1 y entrada calculada dinámicamente
  // desde el bbox de la parte 1 (no hay coordenadas UTM hardcodeadas).
  function loadGranCorridorCloud(viewmode) {
    clearPointClouds();
    const base = 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/gran_corredor/';
    const urls = [];
    for (let i = 1; i <= 10; i++) urls.push(`${base}parte${i}/metadata.json`);

    if (viewmode === 2) viewer.setControls(new Potree.FirstPersonControls(viewer));

    Promise.all(urls.map(u => Potree.loadPointCloud(u))).then(results => {
      const pcs = results.map(r => r.pointcloud);
      for (const pc of pcs) {
        pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
        pc.material.size = (viewmode === 1) ? 1 : 0.5;
        viewer.scene.addPointCloud(pc);
      }

      if (viewmode === 1) { // ---- Modo Dios (aéreo): posiciones naturales + encuadre del bbox unión
        let union = null;
        for (const pc of pcs) {
          pc.updateMatrixWorld(true);
          const b = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
          union = union ? union.union(b) : b;
        }
        const center = union.getCenter(new THREE.Vector3());
        const size = union.getSize(new THREE.Vector3());
        const distance = Math.max(size.x, size.y, size.z) * 1.2;

        console.log(`[GranCorredor/God] center=(${center.x.toFixed(0)},${center.y.toFixed(0)},${center.z.toFixed(0)}) size=(${size.x.toFixed(0)},${size.y.toFixed(0)},${size.z.toFixed(0)}) dist=${distance.toFixed(0)}`);

        const camPos = new THREE.Vector3(
          center.x + distance,
          center.y - distance,
          center.z + distance
        );
        viewer.scene.view.position.copy(camPos);
        viewer.scene.view.lookAt(center);

        viewer.scene.getActiveCamera().near = Math.max(0.1, distance / 1000);
        viewer.scene.getActiveCamera().far = distance * 20;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        viewer.setMoveSpeed(distance / 5);
      } else { // ---- Modo Paseo (walker): escala x10 respecto a pivote común (parte 1)
        const pivot = pcs[0].position.clone();
        for (const pc of pcs) {
          const off = pc.position.clone();
          pc.scale.set(10, 10, 10);
          pc.position.set(
            10 * off.x - 9 * pivot.x,
            10 * off.y - 9 * pivot.y,
            10 * off.z - 9 * pivot.z
          );
          pc.updateMatrix();
        }

        let union = null;
        for (const pc of pcs) {
          pc.updateMatrixWorld(true);
          const b = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
          union = union ? union.union(b) : b;
        }
        const size = union.getSize(new THREE.Vector3());

        viewer.scene.getActiveCamera().near = 0.1;
        viewer.scene.getActiveCamera().far = Math.max(size.x, size.y, size.z) * 10;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        // Entrada de Paseo fijada por el usuario (UTM ground + 20.7 de altura de ojos en coords escaladas x10)
        const camPos = new THREE.Vector3(280617.970, 4413806.330, 447.060 + 20.7);
        console.log(`[GranCorredor/Walker] camPos=(${camPos.x.toFixed(3)},${camPos.y.toFixed(3)},${camPos.z.toFixed(3)})`);
        viewer.scene.view.position.copy(camPos);

        const lookAtPos = camPos.clone();
        lookAtPos.y += 1;
        viewer.scene.view.lookAt(lookAtPos);
        viewer.setMoveSpeed(10);
      }
      syncVRToScene();
    });
  }

  // Carga del "Gran Corredor 2": una sola nube (todo el corredor en un único archivo).
  // Misma lógica que las nubes individuales pero con entrada de Paseo calculada
  // dinámicamente desde el bbox (sin coordenadas UTM hardcodeadas).
  function loadGranCorridor2Cloud(viewmode) {
    clearPointClouds();
    const url = 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/gran_corredor_2/metadata.json';

    if (viewmode === 2) viewer.setControls(new Potree.FirstPersonControls(viewer));

    Potree.loadPointCloud(url).then(e => {
      const pointcloud = e.pointcloud;
      const material = e.pointcloud.material;
      material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      material.size = (viewmode === 1) ? 1 : 0.5;
      viewer.scene.addPointCloud(pointcloud);

      if (viewmode === 1) { // ---- Modo Dios (aéreo)
        pointcloud.updateMatrixWorld(true);
        const bbox = pointcloud.boundingBox.clone().applyMatrix4(pointcloud.matrixWorld);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());
        const distance = Math.max(size.x, size.y, size.z) * 1.2;

        console.log(`[GranCorredor2/God] center=(${center.x.toFixed(0)},${center.y.toFixed(0)},${center.z.toFixed(0)}) size=(${size.x.toFixed(0)},${size.y.toFixed(0)},${size.z.toFixed(0)}) dist=${distance.toFixed(0)}`);

        const camPos = new THREE.Vector3(
          center.x + distance,
          center.y - distance,
          center.z + distance
        );
        viewer.scene.view.position.copy(camPos);
        viewer.scene.view.lookAt(center);

        viewer.scene.getActiveCamera().near = Math.max(0.1, distance / 1000);
        viewer.scene.getActiveCamera().far = distance * 20;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        viewer.setMoveSpeed(distance / 5);
      } else { // ---- Modo Paseo (walker): escala x10 como las nubes individuales
        pointcloud.scale.set(10, 10, 10);
        pointcloud.updateMatrix();
        pointcloud.updateMatrixWorld(true);

        const bbox = pointcloud.boundingBox.clone().applyMatrix4(pointcloud.matrixWorld);
        const size = bbox.getSize(new THREE.Vector3());

        viewer.scene.getActiveCamera().near = 0.1;
        viewer.scene.getActiveCamera().far = Math.max(size.x, size.y, size.z) * 10;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        // Entrada de Paseo fijada por el usuario (UTM ground + 20.7 de altura de ojos en coords escaladas x10)
        const camPos = new THREE.Vector3(454491.539, 3109992.743, 2556.448 + 20.7);
        console.log(`[GranCorredor2/Walker] camPos=(${camPos.x.toFixed(3)},${camPos.y.toFixed(3)},${camPos.z.toFixed(3)})`);
        viewer.scene.view.position.copy(camPos);

        const lookAtPos = camPos.clone();
        lookAtPos.y += 1;
        viewer.scene.view.lookAt(lookAtPos);
        viewer.setMoveSpeed(10);
      }
      // Carteles de sendero (exclusivos de Paseo Garañón). El grupo replica pointcloud.scale
      // (x10 en Paseo, x1 en aéreo). Cartel 1 visible en ambos modos; cartel 2 solo en Paseo.
      window.trailSignGroup = buildTrailSign(pointcloud);
      syncVRToScene();
    });
  }

  // ===== Nube_Con_Anomalias: carga de la nube + cilindros de anomalías =====
  // Igual que las demás nubes (modos Aéreo/Paseo), pero además lee anomalías.json
  // y construye un cilindro rojo translúcido por cada grupo de anomalía.
  function loadAnomaliesCloud(viewmode) {
    clearPointClouds();
    const base = 'https://pub-e5dc5ebf430a493e98528ece772092b4.r2.dev/';
    // La nube puede estar en <base>/Nube_Con_Anomalias/ o en <base>/potree/Nube_Con_Anomalias/.
    // Probamos ambas rutas y usamos la primera que responda (evita depender del prefijo exacto).
    const candidates = ['Nube_Con_Anomalias/', 'potree/Nube_Con_Anomalias/'];

    if (viewmode === 2) viewer.setControls(new Potree.FirstPersonControls(viewer));

    const resolveDir = (async () => {
      for (const c of candidates) {
        try { const r = await fetch(base + c + 'metadata.json'); if (r.ok) return base + c; } catch (err) {}
      }
      return base + candidates[0];
    })();

    resolveDir.then(dir => Promise.all([
      Potree.loadPointCloud(dir + 'metadata.json'),
      fetch(dir + encodeURIComponent('anomalías.json')).then(r => r.ok ? r.json() : null).catch(() => null),
    ])).then(([e, anomData]) => {
      const pointcloud = e.pointcloud;
      const material = pointcloud.material;
      material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      material.size = (viewmode === 1) ? 1 : 0.5;
      viewer.scene.addPointCloud(pointcloud);

      // Centroide UTM de las anomalías (para encuadrar / spawnear cerca en Paseo)
      let anomCenterUTM = null;
      const pts = anomData && anomData.building && anomData.building.points;
      if (pts && pts.length) {
        let cx = 0, cy = 0, cz = 0;
        for (const p of pts) { cx += p.x; cy += p.y; cz += p.z; }
        anomCenterUTM = new THREE.Vector3(cx / pts.length, cy / pts.length, cz / pts.length);
      }

      if (viewmode === 1) { // ---- Modo Dios (aéreo): encuadre del bbox
        pointcloud.updateMatrixWorld(true);
        const bbox = pointcloud.boundingBox.clone().applyMatrix4(pointcloud.matrixWorld);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());
        const distance = Math.max(size.x, size.y, size.z) * 1.2;

        const camPos = new THREE.Vector3(center.x + distance, center.y - distance, center.z + distance);
        viewer.scene.view.position.copy(camPos);
        viewer.scene.view.lookAt(center);

        viewer.scene.getActiveCamera().near = Math.max(0.1, distance / 1000);
        viewer.scene.getActiveCamera().far = distance * 20;
        viewer.scene.getActiveCamera().updateProjectionMatrix();
        viewer.setMoveSpeed(distance / 5);
      } else { // ---- Modo Paseo (walker): escala x10 y spawn cerca de la anomalía
        pointcloud.scale.set(10, 10, 10);
        pointcloud.updateMatrix();
        pointcloud.updateMatrixWorld(true);

        const bbox = pointcloud.boundingBox.clone().applyMatrix4(pointcloud.matrixWorld);
        const size = bbox.getSize(new THREE.Vector3());
        viewer.scene.getActiveCamera().near = 0.1;
        viewer.scene.getActiveCamera().far = Math.max(size.x, size.y, size.z) * 10;
        viewer.scene.getActiveCamera().updateProjectionMatrix();

        // Punto de la anomalía en coords de mundo: world = offset + 10*(UTM - offset)
        // (offset = pointcloud.position; la nube está escalada x10 en Paseo)
        let target;
        if (anomCenterUTM) {
          target = anomCenterUTM.clone().sub(pointcloud.position).multiplyScalar(10).add(pointcloud.position);
        } else {
          target = bbox.getCenter(new THREE.Vector3());
        }
        const camPos = target.clone().add(new THREE.Vector3(0, -120, 60)); // ~12 m atrás, ~6 m arriba
        viewer.scene.view.position.copy(camPos);
        viewer.scene.view.lookAt(target);
        viewer.setMoveSpeed(10);
      }

      // Volúmenes de anomalía (ocultos/sin clip por defecto; se activan con el menú VR / tecla 3)
      const nPts = (anomData && anomData.building && anomData.building.points)
        ? anomData.building.points.length : 0;
      console.log('[Anomalías] json=' + (anomData ? 'OK' : 'NULL') + ' puntos=' + nPts);
      if (anomData) {
        const vols = buildAnomalyCylinders(pointcloud, anomData);
        console.log('[Anomalías] volúmenes=' + vols.length +
          ' escala=' + pointcloud.scale.x + ' activo=' + !!window.anomaliesWanted);
      } else {
        removeAnomalyVolumes();
        console.warn('[Anomalías] no se pudo cargar anomalías.json (revisa la URL del bucket)');
      }

      syncVRToScene();
    });
  }

  // Construye un VOLUMEN DE RECORTE (Potree.BoxVolume con forma 'cylinder') por cada grupo de
  // anomalía, con un cilindro rojo translúcido como hijo visual. Reutiliza la infraestructura
  // de "delimitar zonas":
  //   1) PROFUNDIDAD CORRECTA: los volúmenes se dibujan en viewer.volumeTool.scene, que en VR
  //      se renderiza DESPUÉS de los puntos (viewer.renderVR) y en escritorio en el pase
  //      'render.pass.scene'. Antes el cilindro colgaba de viewer.scene.scene, que en VR se
  //      dibuja ANTES de los puntos -> quedaba detrás. Como volumen ya no.
  //   2) RESALTAR EL INTERIOR: clip=true + clipTask=HIGHLIGHT (por defecto en el viewer) hace
  //      que el shader sume rojo a los puntos dentro del cilindro (igual que las zonas).
  //
  // El volumen vive en COORDENADAS DE MUNDO (igual que las zonas que coloca el usuario):
  //   centroMundo = offset + escala*(UTM_anomalía - offset)
  //   escala del volumen = (2*radio*S, 2*radio*S, altura*S)   [cilindro unidad: radio 0.5, alto 1, eje Z]
  // Así coincide con los puntos renderizados tanto en Aéreo (S=1) como en Paseo (S=10).
  function buildAnomalyCylinders(pointcloud, data) {
    // Quitar volúmenes de una carga anterior
    removeAnomalyVolumes();

    const points = (data.building && data.building.points) ? data.building.points : [];

    // Una anomalía = un grupo de puntos peligrosos (mismo groupId). Dibujamos UN cilindro por
    // grupo que ENGLOBE todos sus puntos: radio = dispersión horizontal + margen, altura = rango
    // vertical + margen.
    const byGroup = new Map();
    for (const p of points) {
      const gid = (p.groupId !== undefined) ? p.groupId : 0;
      if (!byGroup.has(gid)) byGroup.set(gid, []);
      byGroup.get(gid).push(p);
    }

    const S = pointcloud.scale.x;       // escala del modo (1 aéreo, 10 paseo)
    const pcPos = pointcloud.position;  // offset de la nube
    const MARGIN_XY = 1.5;   // margen horizontal (m) sobre la dispersión del grupo
    const MIN_RADIUS = 1.5;  // radio mínimo aunque el grupo sea diminuto
    const MARGIN_Z = 6.0;    // sobresale por arriba y por abajo (m)

    const wanted = !!window.anomaliesWanted;
    const volumes = [];

    for (const [, pts] of byGroup) {
      let cx = 0, cy = 0, minZ = Infinity, maxZ = -Infinity;
      for (const p of pts) { cx += p.x; cy += p.y; minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
      cx /= pts.length; cy /= pts.length;
      const cz = (minZ + maxZ) / 2;

      let maxR = 0;
      for (const p of pts) maxR = Math.max(maxR, Math.hypot(p.x - cx, p.y - cy));
      const radius = Math.max(MIN_RADIUS, maxR + MARGIN_XY);
      const height = (maxZ - minZ) + 2 * MARGIN_Z;

      // UTM -> mundo (igual que el spawn de la cámara: pcPos + S*(C - pcPos))
      const worldCenter = new THREE.Vector3(cx, cy, cz).sub(pcPos).multiplyScalar(S).add(pcPos);

      const v = new Potree.BoxVolume();
      v.name = 'Anomalía';
      v.clip = wanted;                       // afecta al shader solo cuando "Ver Anomalías" está activo
      v.userData.clipShape = 'cylinder';     // leído por viewer.js -> test cilíndrico (eje Z) en el shader
      v.position.copy(worldCenter);
      v.scale.set(2 * radius * S, 2 * radius * S, height * S); // diámetro,diámetro,altura en mundo
      if (v.frame) v.frame.visible = false;  // ocultar el marco de caja por defecto

      // Cilindro rojo translúcido (hijo del volumen -> hereda posición/escala).
      // depthTest:true (se ocluye con lo que tenga delante) + depthWrite:false (deja ver los
      // puntos resaltados del interior). Cilindro unidad: radio 0.5, alto 1, eje Y -> rotamos a Z.
      const geom = new THREE.CylinderGeometry(0.5, 0.5, 1, 24, 1, true);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff0000, transparent: true, opacity: 0.35,
        side: THREE.DoubleSide, depthWrite: false, depthTest: true,
      });
      const cyl = new THREE.Mesh(geom, mat);
      cyl.rotation.x = Math.PI / 2;
      v.add(cyl);

      v.visible = wanted;
      viewer.scene.addVolume(v);
      volumes.push(v);
    }

    window.anomalyVolumes = volumes;
    return volumes;
  }

  // Quita los volúmenes de anomalía del viewer (al cambiar de nube/modo)
  function removeAnomalyVolumes() {
    const vols = window.anomalyVolumes || [];
    for (const v of vols) {
      try { viewer.scene.removeVolume(v); } catch (e) {}
    }
    window.anomalyVolumes = [];
  }

  // ===== Carteles de sendero (solo nube "Paseo Garañón") =====
  // Construye un THREE.Group con DOS carteles de sendero (poste de madera + tabla con forma de
  // flecha y el texto "SENDERO") en coordenadas fijas. Reutiliza EXACTAMENTE el patrón de
  // buildAnomalyCylinders: NO se cuelga del pointcloud (en VR las mallas hijas de la nube son
  // invisibles), sino que se añade a viewer.scene.scene replicando el transform de la nube
  // (group.position = offset UTM, group.scale = escala del modo). Así se ve en escritorio y VR
  // y escala igual que el terreno en ambos modos (x1 aéreo, x10 Paseo). El primer cartel se ve
  // en ambos modos; el segundo desaparece en modo aéreo. Cada cartel lo construye buildOneSign.
  function buildTrailSign(pointcloud) {
    // Limpiar un cartel anterior si existía (cambios de nube/modo)
    if (window.trailSignGroup && window.trailSignGroup.parent) {
      window.trailSignGroup.parent.remove(window.trailSignGroup);
    }

    // --- Posición y orientación base (constantes fáciles de afinar a ojo) ---
    // OJO: estas coordenadas están en el espacio "mundo de modo Paseo" (la nube escalada x10),
    // que es donde el usuario las leyó. NO son UTM reales (el offset de esta nube es
    // 440797,3092075,1572 y su bbox real solo llega a 443992,3093874,1946). Para colocar cada
    // cartel en coords locales de la nube hay que deshacer ese x10: local = (coord - offset)/10
    // (lo hace buildOneSign).
    const SIGN_WORLD = new THREE.Vector3(454568.219, 3109861.783, 2555.618); // base del poste 1 (mundo Paseo)
    // Rumbo del sendero: de la entrada de Paseo hacia el cartel original (misma escala, sirve el rumbo).
    const ENTRY_WORLD = new THREE.Vector2(454491.539, 3109992.743);
    const dirPath = new THREE.Vector2(SIGN_WORLD.x - ENTRY_WORLD.x, SIGN_WORLD.y - ENTRY_WORLD.y);
    // "Derecha del camino" = rumbo girado -90° (sentido horario): (x,y) -> (y,-x).
    const right = new THREE.Vector2(dirPath.y, -dirPath.x);
    // Yaw base para que el eje +X local del cartel (la flecha) apunte a la derecha del camino.
    const SIGN_YAW = Math.atan2(right.y, right.x);

    // Giro extra de cada cartel sobre el rumbo base. Positivo = a la IZQUIERDA (antihorario en
    // vista cenital). Si en pantalla girasen al revés, negar estos valores.
    const DEG = Math.PI / 180;
    const SIGN1_LEFT_DEG = 35;   // cartel original, mejor orientado hacia el sendero
    const SIGN2_LEFT_DEG = 120;  // segundo cartel: apunta mucho más a la izquierda (ajustable a ojo)

    // ¿Modo Paseo (escala x10) o aéreo (x1)? Controla tamaño y si la textura lleva flecha.
    const isWalker = pointcloud.scale.x >= 5;

    // Grupo contenedor: replica el transform de la nube (offset + escala del modo actual).
    const group = new THREE.Group();
    group.name = 'trail-sign';

    // Cartel 1: ubicación original, girado a la izquierda (SIGN1_LEFT_DEG), visible en AMBOS modos, sin flecha.
    group.add(buildOneSign(pointcloud, isWalker, {
      worldPos: SIGN_WORLD,
      yaw: SIGN_YAW + SIGN1_LEFT_DEG * DEG,
      hideInAerial: false,
      noArrow: true,
    }));

    // Cartel 2: ubicación nueva, aún más a la izquierda, OCULTO en modo aéreo y SIN flecha.
    group.add(buildOneSign(pointcloud, isWalker, {
      worldPos: new THREE.Vector3(454173.669, 3107680.793, 2423.058),
      yaw: SIGN_YAW + SIGN2_LEFT_DEG * DEG,
      hideInAerial: true,
      noArrow: true,
    }));

    group.position.copy(pointcloud.position);
    group.scale.copy(pointcloud.scale);
    group.updateMatrix();
    group.updateMatrixWorld(true);

    group.visible = true; // el contenedor siempre se muestra; cada cartel decide su visibilidad
    viewer.scene.scene.add(group); // world scene -> escritorio y VR

    console.log('[Cartel] offset(pc.pos)=(' + pointcloud.position.x.toFixed(1) + ',' + pointcloud.position.y.toFixed(1) + ',' + pointcloud.position.z.toFixed(1) + ')' +
      ' escala=' + pointcloud.scale.x + ' carteles=' + group.children.length);
    return group;
  }

  // Construye UN cartel de sendero (poste de madera + tabla con flecha y el texto "SENDERO") y
  // devuelve su sub-grupo, ya orientado (yaw) y colocado en coords locales de la nube. NO lo añade
  // a la escena: de eso se encarga buildTrailSign metiéndolo en el grupo contenedor. opts:
  //   worldPos     THREE.Vector3 con la base del poste en coords de mundo Paseo (x10)
  //   yaw          rotación final alrededor de Z (rad)
  //   hideInAerial si true, el cartel solo es visible en modo Paseo (desaparece en aéreo)
  function buildOneSign(pointcloud, isWalker, opts) {
    const WALK_SCALE = 10;

    // --- Materiales de madera ---
    // OPACO con depthTest/depthWrite activos: así en VR (donde scene.scene se dibuja ANTES que
    // los puntos y el pRenderer no limpia el depth) los puntos hacen depth-test contra el cartel
    // y dejan de pintarse por encima. En escritorio el cartel se redibuja en el overlay, que
    // ocurre tras clearDepth(), así que queda encima igualmente.
    const WOOD = 0x8B5A2B;
    const woodMat = new THREE.MeshBasicMaterial({
      color: WOOD, side: THREE.DoubleSide,
      transparent: false, depthTest: true, depthWrite: true,
    });

    // Textura de canvas para la tabla: fondo madera + "SENDERO" (+ flecha solo en modo Paseo;
    // en aéreo el usuario la quiere sin la flecha blanca, solo el texto). Mismo truco que los
    // botones del menú VR: canvas -> CanvasTexture -> map.
    const cv = document.createElement('canvas');
    cv.width = 1024; cv.height = 330;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, 0, cv.width, cv.height);
    // vetas/sombreado simple
    ctx.strokeStyle = 'rgba(60,30,10,0.35)'; ctx.lineWidth = 6;
    for (let y = 40; y < cv.height; y += 70) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }
    ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 18;
    ctx.strokeRect(9, 9, cv.width - 18, cv.height - 18);
    // texto (centrado si no hay flecha, alineado a la izquierda si la hay)
    ctx.fillStyle = '#F7E8C8';
    ctx.font = 'bold 150px Arial';
    ctx.textBaseline = 'middle';
    // Flecha solo en modo Paseo y si el cartel no la desactiva (opts.noArrow). Si no, texto centrado.
    if (isWalker && !opts.noArrow) {
      ctx.textAlign = 'left';
      ctx.fillText('SENDERO', 60, cv.height / 2);
      // flecha apuntando a la derecha (+X)
      ctx.beginPath();
      ctx.moveTo(760, cv.height / 2 - 55);
      ctx.lineTo(870, cv.height / 2 - 55);
      ctx.lineTo(870, cv.height / 2 - 100);
      ctx.lineTo(970, cv.height / 2);
      ctx.lineTo(870, cv.height / 2 + 100);
      ctx.lineTo(870, cv.height / 2 + 55);
      ctx.lineTo(760, cv.height / 2 + 55);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.textAlign = 'center';
      ctx.fillText('SENDERO', cv.width / 2, cv.height / 2);
    }
    const tex = new THREE.CanvasTexture(cv);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    const plankMat = new THREE.MeshBasicMaterial({
      map: tex, side: THREE.DoubleSide,
      transparent: false, depthTest: true, depthWrite: true,
    });

    // --- Sub-grupo del cartel en marco canónico: Z arriba, +X = dirección de la flecha ---
    const sign = new THREE.Group();

    // Poste (cilindro vertical). El eje del cilindro es Y -> lo rotamos a Z (vertical).
    const postGeom = new THREE.CylinderGeometry(0.06, 0.06, 2.4, 12);
    const post = new THREE.Mesh(postGeom, woodMat);
    post.rotation.x = Math.PI / 2;
    post.position.set(0, 0, 1.2); // base en z=0, top en z=2.4
    sign.add(post);

    // Tabla: cuerpo de madera (caja 1.4 largo X x 0.05 grosor Y x 0.45 alto Z). El TEXTO no se pinta
    // en las caras del box: por sus UV, una de las caras grandes (±Y) sale boca abajo. En su lugar el
    // texto va en DOS planos, uno por cara, así se lee derecho por delante y por detrás.
    const plankGeom = new THREE.BoxGeometry(1.4, 0.05, 0.45);
    const plank = new THREE.Mesh(plankGeom, woodMat);
    plank.position.set(0.7, 0, 2.1); // arranca en el poste (x=0), apunta a +X, cerca del top
    sign.add(plank);

    // Texto por las dos caras (±Y). Un PlaneGeometry con la CanvasTexture, visto desde su normal +Z,
    // muestra el canvas tal cual (derecho). qBack: girar +90° en X lleva la normal a -Y con "arriba"
    // hacia +Z (se lee derecho desde detrás). qFront: la trasera girada 180° sobre la vertical Z, así
    // mira a +Y y SIGUE derecha (girar sobre Z nunca deja el texto boca abajo). Cada plano va un poco
    // por fuera de su cara. (La flecha apunta a la punta de madera por la cara -Y; por la +Y queda a
    // la inversa, pero el texto se lee bien por ambas.)
    const qBack = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
    const qFront = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI).multiply(qBack);

    const plankFront = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.45), plankMat);
    plankFront.quaternion.copy(qFront);
    plankFront.position.set(0.7, 0.027, 2.1);
    sign.add(plankFront);

    const plankBack = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.45), plankMat);
    plankBack.quaternion.copy(qBack);
    plankBack.position.set(0.7, -0.027, 2.1);
    sign.add(plankBack);

    // Punta de flecha (triángulo extruido) en el extremo +X de la tabla.
    const tipShape = new THREE.Shape();
    tipShape.moveTo(0, -0.225); tipShape.lineTo(0, 0.225); tipShape.lineTo(0.30, 0); tipShape.lineTo(0, -0.225);
    const tipGeom = new THREE.ExtrudeGeometry(tipShape, { depth: 0.05, bevelEnabled: false });
    tipGeom.translate(0, 0, -0.025); // centrar el grosor
    tipGeom.rotateX(Math.PI / 2);    // plano de la forma XY -> XZ del mundo; extrusión -> Y (grosor)
    const tip = new THREE.Mesh(tipGeom, woodMat);
    tip.position.set(1.4, 0, 2.1);
    sign.add(tip);

    // Orientar el cartel (yaw alrededor de Z) y colocarlo en coords locales de la nube.
    // local = (coordMundoPaseo - offset) / 10. Así el grupo contenedor (que replica pos+escala de
    // la nube) lo deja en el sitio correcto en AMBOS modos: aéreo (x1) y Paseo (x10).
    sign.rotation.z = opts.yaw;
    sign.position.copy(opts.worldPos.clone().sub(pointcloud.position).divideScalar(WALK_SCALE));

    // El cartel se construye a tamaño real (~2.4 m). En Paseo el grupo lo escala x10 y queda a
    // tamaño humano (correcto). En aéreo (x1) 2.4 m sería un punto invisible desde km de
    // distancia, así que lo agrandamos para que se vea como baliza desde arriba.
    const GOD_SIGN_SCALE = 25;
    if (!isWalker) sign.scale.setScalar(GOD_SIGN_SCALE);

    sign.traverse(o => { if (o.isMesh) o.renderOrder = 9999; });

    // Visibilidad: por defecto siempre visible; si hideInAerial, solo en modo Paseo (oculto en aéreo).
    sign.visible = opts.hideInAerial ? isWalker : true;

    return sign;
  }

</script>
